buildscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'io.jmix.gradle:jmix-gradle-plugin:3.0.3'
    }
}

group = 'de.bytestore'
version = '3.0.8-internal'

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'io.jmix'

    repositories {
        mavenCentral()
        maven {
            url = uri('https://nexus.jmix.io/repository/public')
        }
    }

    jmix {
        bomVersion = '3.0.3'
        projectId = 'plugin'
    }

    group = this.group
    version = this.version


    java {
        toolchain.languageVersion.set(JavaLanguageVersion.of(21))
        withSourcesJar()
    }

    artifacts {
        archives sourcesJar
    }

    dependencies {
        api('org.pf4j:pf4j:3.15.0') {
            exclude group: 'org.slf4j', module: 'slf4j-reload4j'
        }
        api('org.pf4j:pf4j-spring:0.10.0') {
            exclude group: 'org.slf4j', module: 'slf4j-reload4j'
        }
    }

    tasks.assemble {
        dependsOn jar, sourcesJar
    }

    afterEvaluate {
        publishing {
            repositories {
                maven {
                    name = "GitHubPackages"
                    url = uri("https://maven.pkg.github.com/Gamer08YT/jmix-plugin-addon")
                    credentials {
                        username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
                        password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
                    }
                }
            }
            publications {
                javaMaven(MavenPublication) {
                    artifactId = project.base.archivesName.get()
                    from components.java
                }
            }
        }
    }

    // remove after https://youtrack.jetbrains.com/issue/IDEA-227215 is fixed
    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    project.tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.add("-parameters")
    }
}